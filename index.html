<body>

<canvas id="spider-canvas"></canvas>

<div class="portal-wrapper">

  </div>

  <div class="books">
    <a href="https://xumo-git.github.io/pansi/" class="book-card" target="_blank">
      <div class="card-number">壹</div>
      <div class="card-content">
        <h2>盘丝洞</h2>
        <p class="card-subtitle">PANSI CAVE · 写作中枢</p>
        <p class="card-desc">我真是袁天罡 · 天命五九 · 驯蕊 — 三书连载，杏林春暖，水墨暗金。</p>

    <a href="#" class="book-card disabled">
      <div class="card-number">贰</div>

    <a href="#" class="book-card disabled">

<div class="portal-footer">
  <span class="author">诩墨</span> · 三界中枢<br>

</div>

<script>
(function(){
  var canvas = document.getElementById('spider-canvas');
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var mouseX = -9999, mouseY = -9999, mouseActive = false;
  canvas.addEventListener('mousemove', function(e) {
    mouseX = e.clientX; mouseY = e.clientY; mouseActive = true;
  });
  canvas.addEventListener('mouseleave', function() {
    mouseActive = false;
  });

  // ── 工具 ──
  function lighten(hex, amt) {
    var r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return 'rgb(' + Math.min(255,r+amt) + ',' + Math.min(255,g+amt) + ',' + Math.min(255,b+amt) + ')';
  }
  function darken(hex, amt) {
    var r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return 'rgb(' + Math.max(0,r-amt) + ',' + Math.max(0,g-amt) + ',' + Math.max(0,b-amt) + ')';
  }

  // ── Verlet 物理蛛网 ──
  var webs = [];

  function PhysicsParticle(x, y) {
    this.x = x; this.y = y;
    this.oldX = x; this.oldY = y;
    this.pinned = false;
  }

  function PhysicsConstraint(pa, pb, stiffness) {
    this.pa = pa; this.pb = pb;
    var dx = pb.x - pa.x, dy = pb.y - pa.y;
    this.restLen = Math.sqrt(dx*dx + dy*dy) || 1;
    this.stiffness = stiffness || 0.5;
  }

  function makePhysicsWeb(cx, cy, radius) {
    var spokes = 8, rings = 5;
    var ps = [], cs = [];
    var phase = Math.random() * Math.PI * 2;

    var center = new PhysicsParticle(cx, cy);
    center.pinned = true;
    ps.push(center);

    for (var s = 0; s < spokes; s++) {
      var a = (s / spokes) * Math.PI * 2 + (Math.random() - 0.5) * 0.04;
      for (var r = 1; r <= rings; r++) {
        var d = (r / rings) * radius;
        ps.push(new PhysicsParticle(cx + Math.cos(a) * d, cy + Math.sin(a) * d));
      }
    }

    for (var s = 0; s < spokes; s++) {
      cs.push(new PhysicsConstraint(ps[0], ps[1 + s * rings], 0.6));
      for (var r = 0; r < rings - 1; r++)
        cs.push(new PhysicsConstraint(ps[1 + s * rings + r], ps[1 + s * rings + r + 1], 0.5));
    }

    for (var r = 0; r < rings; r++)
      for (var s = 0; s < spokes; s++)
        cs.push(new PhysicsConstraint(ps[1 + s * rings + r], ps[1 + ((s+1)%spokes) * rings + r], 0.3));

    for (var r = 0; r < rings - 1; r++)
      for (var s = 0; s < spokes; s++)
        cs.push(new PhysicsConstraint(ps[1 + s * rings + r], ps[1 + ((s+1)%spokes) * rings + r + 1], 0.2));

    return { ps: ps, cs: cs, cx: cx, cy: cy, radius: radius, phase: phase };
  }

  function initWebs() {
    webs = [];
    var count = 5 + Math.floor(Math.random() * 3);
    var midW = Math.min(500, W * 0.78);
    var midX = (W - midW) / 2;
    var midY = 50;
    var midH = Math.min(H * 0.78, 600);

    function overlap(cx, cy, r) {
      var m = r + 35;
      return cx + m > midX && cx - m < midX + midW && cy + m > midY && cy - m < midY + midH;
    }
    function overlapOther(cx, cy, r) {
      for (var j = 0; j < webs.length; j++) {
        var w = webs[j];
        if ((cx-w.cx)*(cx-w.cx) + (cy-w.cy)*(cy-w.cy) < (r + w.radius + 50) * (r + w.radius + 50))
          return true;
      }
      return false;
    }

    var topH = Math.max(0, midY - 30);
    var botH = Math.max(0, H - midY - midH - 30);
    var leftW = Math.max(0, midX - 30);
    var rightW = Math.max(0, W - midX - midW - 30);

    for (var i = 0; i < count * 5 && webs.length < count; i++) {
      var r = 40 + Math.random() * 70;
      var zone = Math.random(), x, y;
      if (zone < 0.30 && topH > r * 0.5) {
        x = 20 + Math.random() * (W - 40);
        y = 10 - r * 0.3 + Math.random() * topH;
      } else if (zone < 0.50 && leftW > r * 0.5) {
        x = 10 - r * 0.3 + Math.random() * leftW;
        y = 20 + Math.random() * (H - 40);
      } else if (zone < 0.70 && rightW > r * 0.5) {
        x = midX + midW + 20 + Math.random() * (rightW + r * 0.3);
        y = 20 + Math.random() * (H - 40);
      } else if (botH > r * 0.5) {
        x = 20 + Math.random() * (W - 40);
        y = midY + midH + 20 + Math.random() * botH;
      } else continue;
      if (!overlap(x, y, r) && !overlapOther(x, y, r))
        webs.push(makePhysicsWeb(x, y, r));
    }
  }

  function updateWebs(dt) {
    var t = Date.now() * 0.001;
    webs.forEach(function(w) {
      for (var i = 0; i < w.ps.length; i++) {
        var p = w.ps[i];
        if (p.pinned) continue;
        var vx = (p.x - p.oldX) * 0.97;
        var vy = (p.y - p.oldY) * 0.97;
        var wind = Math.sin(t * 0.3 + w.phase) * 0.15 + Math.sin(t * 0.7 + w.phase * 1.3) * 0.08;
        var lift = Math.sin(t * 0.5 + w.phase * 0.7) * 0.05;
        p.oldX = p.x; p.oldY = p.y;
        p.x += vx + wind * 0.3;
        p.y += vy + lift * 0.2;
      }
      for (var iter = 0; iter < 5; iter++) {
        for (var c = 0; c < w.cs.length; c++) {
          var con = w.cs[c];
          var pa = con.pa, pb = con.pb;
          var dx = pb.x - pa.x, dy = pb.y - pa.y;
          var dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 0.001) continue;
          var diff = (dist - con.restLen) / dist * con.stiffness;
          var ox = dx * diff * 0.5, oy = dy * diff * 0.5;
          if (!pa.pinned) { pa.x += ox; pa.y += oy; }
          if (!pb.pinned) { pb.x -= ox; pb.y -= oy; }
        }
      }
      if (mouseActive) {
        for (var i = 0; i < w.ps.length; i++) {
          var p = w.ps[i];
          if (p.pinned) continue;
          var dx = p.x - mouseX, dy = p.y - mouseY;
          var dist2 = dx*dx + dy*dy;
          if (dist2 < 2500 && dist2 > 1) {
            var force = (50 - Math.sqrt(dist2)) / 50 * 2;
            p.x += (dx / Math.sqrt(dist2)) * force;
            p.y += (dy / Math.sqrt(dist2)) * force;
          }
        }
      }
    });
  }

  function drawWebs() {
    webs.forEach(function(w) {
      for (var pass = 0; pass < 2; pass++) {
        ctx.lineWidth = pass === 0 ? 0.7 : 0.3;
        ctx.strokeStyle = pass === 0 ? 'rgba(200,195,185,0.18)' : 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        for (var c = 0; c < w.cs.length; c++) {
          var con = w.cs[c];
          var off = pass === 1 ? 0.5 : 0;
          ctx.moveTo(con.pa.x + off, con.pa.y + off);
          ctx.lineTo(con.pb.x + off, con.pb.y + off);
        }
        ctx.stroke();
      }
    });
  }

  // ── 蜘蛛（悬挂氛围用） ──
  var spiders = [];
  var SPIDER_PALETTES = [
    { body: '#c23b22', abdomen: '#8a2a18', leg: '#a63322', mark: 'rgba(255,255,255,0.4)' },
    { body: '#722ed1', abdomen: '#531dab', leg: '#9254de', mark: 'rgba(255,200,255,0.3)' },
    { body: '#13c2c2', abdomen: '#08979c', leg: '#36cfc9', mark: 'rgba(255,255,200,0.3)' },
    { body: '#faad14', abdomen: '#d48806', leg: '#ffc53d', mark: 'rgba(255,100,100,0.3)' },
    { body: '#f5222d', abdomen: '#a8071a', leg: '#cf1322', mark: 'rgba(255,255,255,0.5)' },
    { body: '#2f54eb', abdomen: '#1d39c4', leg: '#597ef7', mark: 'rgba(200,200,255,0.35)' },
  ];

  function createSpider() {
    var pal = SPIDER_PALETTES[Math.floor(Math.random() * SPIDER_PALETTES.length)];
    return {
      size: 0.8 + Math.random() * 1.0,
      phase: Math.random() * 100,
      legPhase: 0,
      anchorX: 20 + Math.random() * (W - 40),
      anchorY: -5 - Math.random() * 10,
      threadLen: H * (0.15 + Math.random() * 0.35),
      angle: (Math.random() - 0.5) * 0.5,
      windX: 0,
      speed: 0.3 + Math.random() * 0.8,
      bodyColor: pal.body,
      abdomenColor: pal.abdomen,
      legColor: pal.leg,
      markColor: pal.mark,
    };
  }

  function initSpiders() {
    spiders = [];
    for (var i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
      var sp = createSpider();
      sp.x = sp.anchorX + Math.sin(sp.angle) * sp.threadLen;
      sp.y = sp.anchorY + Math.cos(sp.angle) * sp.threadLen;
      spiders.push(sp);
    }
  }

  function updateSpiders() {
    var t = Date.now() * 0.001;
    spiders.forEach(function(sp) {
      sp.windX = Math.sin(t * 0.12 + sp.phase * 0.01) * 5;
      var gravity = 0.003, damping = 0.997;
      var windForce = Math.sin(t * 0.15 + sp.phase * 0.01) * 0.0001;
      sp.angle = sp.angle * damping - gravity * Math.sin(sp.angle) / (sp.threadLen * 0.008 + 1) + windForce - Math.sin(sp.angle) * 0.0004;
      sp.x = sp.anchorX + Math.sin(sp.angle) * sp.threadLen + sp.windX;
      sp.y = sp.anchorY + Math.cos(sp.angle) * sp.threadLen;
      sp.legPhase += 0.02;
    });
  }

  function drawSpider(sp, time) {
    var x = sp.x, y = sp.y;
    var s = 14 + sp.size * 5;
    var t = time, seed = sp.phase;

    // 蛛丝
    ctx.strokeStyle = 'rgba(210,200,190,0.35)';
    ctx.lineWidth = 1.2 + sp.size * 0.3;
    ctx.beginPath();
    ctx.moveTo(sp.anchorX, sp.anchorY);
    var midX = (sp.anchorX + x) / 2 + Math.sin(t * 0.3 + seed * 0.01 + seed) * 4;
    var midY = (sp.anchorY + y) / 2 - 4;
    ctx.quadraticCurveTo(midX, midY, x, y - s * 0.15);
    ctx.stroke();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI + sp.angle * 0.3);

    // 简化的侧视蜘蛛
    ctx.beginPath();
    var aPts = 16;
    for (var i = 0; i <= aPts; i++) {
      var ang = (i / aPts) * Math.PI * 2;
      var px = Math.cos(ang) * s * 0.55;
      var py = s * 0.45 + Math.sin(ang) * s * 0.7;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var grad = ctx.createRadialGradient(0, s*0.35, 0, 0, s*0.3, s*0.7);
    grad.addColorStop(0, lighten(sp.abdomenColor, 20));
    grad.addColorStop(0.5, sp.abdomenColor);
    grad.addColorStop(1, darken(sp.abdomenColor, 30));
    ctx.fillStyle = grad;
    ctx.fill();

    // 头胸部
    ctx.beginPath();
    for (var i = 0; i <= aPts; i++) {
      var ang = (i / aPts) * Math.PI * 2;
      var px = Math.cos(ang) * s * 0.42;
      var py = -s * 0.15 + Math.sin(ang) * s * 0.38;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    var grad2 = ctx.createRadialGradient(0, -s*0.2, 0, 0, -s*0.15, s*0.4);
    grad2.addColorStop(0, lighten(sp.bodyColor, 25));
    grad2.addColorStop(0.5, sp.bodyColor);
    grad2.addColorStop(1, darken(sp.bodyColor, 20));
    ctx.fillStyle = grad2;
    ctx.fill();

    // 腿
    ctx.lineCap = 'round';
    ctx.strokeStyle = sp.legColor;
    for (var side = -1; side <= 1; side += 2) {
      for (var li = 0; li < 4; li++) {
        var baseY = ((li/3)-0.5) * s * 0.4;
        var lenF = s * (0.8 + li * 0.12);
        var lenT = s * (1.0 + li * 0.1);
        var lenM = s * (0.6 - li * 0.04);
        var ang1 = side * (0.3 + li * 0.1 + Math.sin(sp.legPhase + li) * 0.2);
        var ang2 = side * (0.5 + Math.sin(sp.legPhase + li * 0.7) * 0.15);
        var sx = side * s * 0.35, sy = baseY;
        var fex = sx + Math.cos(ang1) * lenF, fey = sy + Math.sin(ang1) * lenF * 0.4;
        var tex = fex + Math.cos(ang1+ang2) * lenT, tey = fey + Math.sin(ang1+ang2) * lenT;
        var mex = tex + Math.sin(ang1+ang2) * lenM * 0.5, mey = tey + Math.cos(ang1+ang2) * lenM;
        ctx.lineWidth = 2.0 - li * 0.1;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(fex, fey);
        ctx.lineTo(tex, tey);
        ctx.lineTo(mex, mey);
        ctx.stroke();
      }
    }

    // 眼睛
    var eY = -s * 0.4;
    ctx.fillStyle = 'rgba(220,210,200,0.8)';
    [[-s*0.13, eY], [s*0.13, eY]].forEach(function(e) {
      ctx.beginPath();
      ctx.arc(e[0], e[1], s*0.04, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.fillStyle = 'rgba(10,8,8,0.9)';
    [[-s*0.13, eY], [s*0.13, eY]].forEach(function(e) {
      ctx.beginPath();
      ctx.arc(e[0], e[1], s*0.02, 0, Math.PI*2);
      ctx.fill();
    });

    ctx.restore();
  }

  // ── 主循环 ──
  function init() {
    initWebs();
    initSpiders();
  }

  var lastTime = 0;
  function loop(timestamp) {
    var dt = lastTime ? Math.min((timestamp - lastTime) * 0.001, 0.05) : 0.016;
    lastTime = timestamp;
    ctx.clearRect(0, 0, W, H);
    updateWebs(dt);
    drawWebs();
    updateSpiders();
    spiders.forEach(function(sp) {
      drawSpider(sp, timestamp * 0.001);
    });
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);

  window.addEventListener('resize', function() {
    setTimeout(function() {
      resize();
      initWebs();
      initSpiders();
    }, 200);
  });
})();
</script>

</body>
</html>
