<script>
(function() {
  'use strict';

  var canvas = document.getElementById('bg-canvas');
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ─── 颜色工具 ───

  function lerpColor(c1, c2, t) {
    var a = [parseInt(c1.slice(1,3),16), parseInt(c1.slice(3,5),16), parseInt(c1.slice(5,7),16)];
    var b = [parseInt(c2.slice(1,3),16), parseInt(c2.slice(3,5),16), parseInt(c2.slice(5,7),16)];
    var r = Math.round(a[0]+(b[0]-a[0])*t), g = Math.round(a[1]+(b[1]-a[1])*t), bl = Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }

  function hsl(h, s, l) {
    return 'hsl('+h+','+s+'%,'+l+'%)';
  }

  var R = '#cc1a2b';
  var DR = '#66111a';
  var CR = '#ff3344';
  var GRN = '#1a2e14';
  var GOLD = '#b8963e';

  // ─── 彼岸花（Red Spider Lily）───

  var stalks = [];

  function makeLilyStalk(x, y, h, n) {
    var flowers = [];
    for (var i = 0; i < n; i++) {
      flowers.push({
        a: (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.6,
        off: (Math.random() - 0.5) * 12,
        sz: 18 + Math.random() * 14,
        ph: Math.random() * 100,
        spd: 0.3 + Math.random() * 0.5,
        bloom: 0.1 + Math.random() * 0.9,
      });
    }
    return {
      x: x, y: y, h: h,
      phase: Math.random() * 100,
      curve: (Math.random() - 0.5) * 8,
      curve2: (Math.random() - 0.5) * 4,
      flowers: flowers,
    };
  }

  function initLilies() {
    stalks = [];

    var cx = W / 2, cy = H * 0.35;
    var czW = 640, czH = 620;
    var czL = cx - czW / 2, czR = cx + czW / 2;
    var czT = cy - czH / 2, czB = cy + czH / 2;

    function avoidCenter(x, y) {
      return x > czL - 50 && x < czR + 50 && y > czT - 30 && y < czB + 30;
    }

    var n = 30 + Math.floor(Math.random() * 20);
    var attempts = 0;

    while (stalks.length < n && attempts < 300) {
      attempts++;
      var x, y;
      var zone = Math.random();
      if (zone < 0.45) {
        x = 20 + Math.random() * (W - 40);
        y = H + 10 + Math.random() * 30;
      } else if (zone < 0.65) {
        x = -20 - Math.random() * 50;
        y = 40 + Math.random() * (H - 80);
      } else if (zone < 0.85) {
        x = W + 20 + Math.random() * 50;
        y = 40 + Math.random() * (H - 80);
      } else {
        x = 20 + Math.random() * (W - 40);
        y = -10 - Math.random() * 30;
      }

      var h = 80 + Math.random() * 200;
      var topY = y - h;
      if (avoidCenter(x, topY)) continue;

      var fn = 2 + Math.floor(Math.random() * 6);
      stalks.push(makeLilyStalk(x, y, h, fn));
    }
  }

  function drawPetal(ctx, angle, size, bloom, stamp) {
    ctx.save();
    ctx.rotate(angle + Math.sin(stamp * 0.5) * 0.02);

    var len = size;
    var b = Math.min(1, bloom * 1.2);
    var steps = 16;
    var pts = [];

    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var x = t * len * 1.3;
      var y = -Math.sin(t * Math.PI * 0.7) * len * 0.32
             + t * t * len * 0.16
             + Math.sin(t * Math.PI * 6 + stamp) * len * 0.015;
      var w = Math.sin(t * Math.PI) * len * 0.09 * (0.8 + 0.2 * b);
      pts.push({ x: x, y: y, w: w });
    }

    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var px = pts[i].x * b, py = pts[i].y - pts[i].w;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    for (var i = pts.length - 1; i >= 0; i--) {
      var px = pts[i].x * b, py = pts[i].y + pts[i].w;
      ctx.lineTo(px, py);
    }
    ctx.closePath();

    var grad = ctx.createLinearGradient(-len * 0.3, 0, len*0.8, 0);
    grad.addColorStop(0, DR);
    grad.addColorStop(0.15, R);
    grad.addColorStop(0.5, CR);
    grad.addColorStop(0.85, R);
    grad.addColorStop(1, '#440810');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.85 + 0.15 * b;
    ctx.fill();

    ctx.strokeStyle = 'rgba(200,100,120,0.25)';
    ctx.lineWidth = 0.4;
    ctx.stroke();

    ctx.restore();
  }

  function drawStamen(ctx, angle, size, bloom, stamp) {
    ctx.save();
    ctx.rotate(angle);

    var len = size * (1.6 + Math.random() * 0.3);
    var b = Math.min(1, bloom * 1.2);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    var bend = Math.sin(stamp * 0.7 + angle * 2) * len * 0.08;
    ctx.quadraticCurveTo(len * 0.5 + bend, -len * 0.05, len * b, Math.sin(stamp + angle) * len * 0.1);
    ctx.strokeStyle = '#cc2233';
    ctx.lineWidth = 0.6;
    ctx.globalAlpha = 0.5 * b;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(len * b, Math.sin(stamp + angle) * len * 0.1, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#33110a';
    ctx.globalAlpha = 0.6 * b;
    ctx.fill();

    ctx.restore();
  }

  function drawLilyStalk(s, time) {
    var t = time * 0.001;
    var sway = Math.sin(t * 0.4 + s.phase) * 3;
    var sway2 = Math.sin(t * 0.25 + s.phase * 1.7) * 2;

    var segs = 12;
    ctx.strokeStyle = GRN;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = 0; i <= segs; i++) {
      var r = i / segs;
      var ft = r * r;
      var x = s.x + s.curve * r + Math.sin(r * 3 + s.phase) * 2 + ft * sway + ft * ft * sway2;
      var y = s.y - r * s.h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    var tx = s.x + s.curve + sway + sway2;
    var ty = s.y - s.h;

    s.flowers.forEach(function(f) {
      var fb = Math.min(1, t * f.spd * 0.3);
      var bloom = f.bloom * fb;
      if (bloom < 0.01) return;

      var fx = tx + Math.cos(f.a) * 6 + f.off * 0.3;
      var fy = ty + Math.sin(f.a) * 3;

      ctx.save();
      ctx.translate(fx, fy);

      for (var p = 0; p < 6; p++) {
        var pa = (p / 6) * Math.PI * 2 + f.a * 0.5 + Math.sin(t * 0.3 + f.ph) * 0.03;
        var ps = f.sz * (0.7 + 0.3 * Math.sin(t * 0.5 + f.ph));
        drawPetal(ctx, pa, ps, bloom, t * 2 + f.ph);
      }

      for (var st = 0; st < 6; st++) {
        var sta = (st / 6) * Math.PI * 2 + (Math.random() - 0.5) * 0.3 + Math.sin(t * 0.4 + f.ph * 0.7) * 0.05;
        drawStamen(ctx, sta, f.sz, bloom, t + f.ph);
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    });
  }

  // ─── 蛇 ───

  var SNAKE_COLORS = [
    { body: ['#1a3a1a', '#2d5a2d', '#1a3a1a'], belly: '#4a7a4a', eye: '#88ff88', pattern: '#3a6a3a' },
    { body: ['#1a1110', '#332220', '#1a1110'], belly: '#443332', eye: '#ffcc44', pattern: '#2a1a18' },
    { body: ['#441110', '#662020', '#441110'], belly: '#883333', eye: '#ffee88', pattern: '#552020' },
    { body: ['#222228', '#3a3a42', '#222228'], belly: '#665566', eye: '#ff6644', pattern: '#444450' },
    { body: ['#1a1a10', '#3a3a20', '#1a1a10'], belly: '#5a5a30', eye: '#aacc44', pattern: '#2a2a18' },
  ];

  var snakes = [];

  function makeSnake() {
    var pal = SNAKE_COLORS[Math.floor(Math.random() * SNAKE_COLORS.length)];
    var segs = 25 + Math.floor(Math.random() * 15);
    var bodyLen = 80 + Math.random() * 150;
    var segDist = bodyLen / segs;
    var speed = 0.4 + Math.random() * 0.8;

    var edge = Math.floor(Math.random() * 4);
    var x, y, dx, dy;
    if (edge === 0) { x = Math.random() * W; y = -20; dx = 0.3 + Math.random() * 0.4; dy = 0.6 + Math.random() * 0.3; }
    else if (edge === 1) { x = W + 20; y = Math.random() * H; dx = -(0.3 + Math.random() * 0.4); dy = (Math.random()-0.5) * 0.5; }
    else if (edge === 2) { x = Math.random() * W; y = H + 20; dx = (Math.random()-0.5) * 0.6; dy = -(0.3 + Math.random() * 0.3); }
    else { x = -20; y = Math.random() * H; dx = 0.3 + Math.random() * 0.4; dy = (Math.random()-0.5) * 0.5; }

    var points = [];
    for (var i = 0; i < segs; i++) {
      points.push({ x: x - dx * segDist * i, y: y - dy * segDist * i * 0.5 });
    }

    return {
      points: points,
      segs: segs,
      segDist: segDist,
      speed: speed,
      pal: pal,
      phase: Math.random() * 100,
      slitherAmp: 3 + Math.random() * 4,
      slitherFreq: 2 + Math.random() * 2,
      thickness: 3 + Math.random() * 3,
      headX: x, headY: y,
      dx: dx, dy: dy,
      wanderTimer: 0,
      wanderAngle: Math.atan2(dy, dx),
      tongueOut: 0,
    };
  }

  function initSnakes() {
    snakes = [];
    var n = 5 + Math.floor(Math.random() * 4);
    for (var i = 0; i < n; i++) {
      snakes.push(makeSnake());
    }
  }

  function updateSnake(s, time) {
    var t = time * 0.001;
    s.tongueOut = 0.5 + 0.5 * Math.sin(t * 2 + s.phase);

    s.wanderTimer += 0.01;
    if (s.wanderTimer > 1) {
      s.wanderTimer = 0;
      s.wanderAngle += (Math.random() - 0.5) * 0.8;
    }

    var spd = s.speed * (0.8 + 0.2 * Math.sin(t * 0.3 + s.phase));
    s.headX += Math.cos(s.wanderAngle) * spd;
    s.headY += Math.sin(s.wanderAngle) * spd;

    if (s.headX < -60) s.wanderAngle = -0.2 + Math.random() * 0.4;
    if (s.headX > W + 60) s.wanderAngle = Math.PI - 0.2 + Math.random() * 0.4;
    if (s.headY < -60) s.wanderAngle = 0.2 + Math.random() * 0.4;
    if (s.headY > H + 60) s.wanderAngle = -Math.PI + 0.2 + Math.random() * 0.4;

    var dx = s.headX - s.points[0].x;
    var dy = s.headY - s.points[0].y;
    if (dx * dx + dy * dy > 1) {
      s.points[0].x += dx * 0.3;
      s.points[0].y += dy * 0.3;
    } else {
      s.points[0].x = s.headX;
      s.points[0].y = s.headY;
    }

    for (var i = 1; i < s.segs; i++) {
      var p = s.points[i];
      var prev = s.points[i-1];
      var dx2 = p.x - prev.x;
      var dy2 = p.y - prev.y;
      var dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      if (dist < 0.001) continue;
      var diff = (dist - s.segDist) / dist * 0.5;
      p.x -= dx2 * diff;
      p.y -= dy2 * diff;
    }

    var dirX = s.points[1].x - s.points[0].x;
    var dirY = s.points[1].y - s.points[0].y;
    var dirLen = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
    dirX /= dirLen; dirY /= dirLen;
    var perpX = -dirY, perpY = dirX;

    for (var i = 0; i < s.segs; i++) {
      var p = s.points[i];
      var r = i / s.segs;
      var sl = Math.sin(t * s.slitherFreq + r * Math.PI * 3 + s.phase) * s.slitherAmp * (1 - r * 0.5);
      p.x += perpX * sl * 0.05;
      p.y += perpY * sl * 0.05;
    }
  }

  function drawSnake(s, time) {
    var pts = s.points;
    if (pts.length < 2) return;

    var thick = s.thickness;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (var pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (var i = 0; i < pts.length; i++) {
        var x = pts[i].x, y = pts[i].y;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      if (pass === 0) {
        ctx.strokeStyle = s.pal.belly;
        ctx.lineWidth = thick * 1.2;
        ctx.globalAlpha = 0.3;
        ctx.stroke();
      } else {
        var grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length-1].x, pts[pts.length-1].y);
        grad.addColorStop(0, s.pal.body[0]);
        grad.addColorStop(0.3, s.pal.body[1]);
        grad.addColorStop(1, s.pal.body[2]);
        ctx.strokeStyle = grad;
        ctx.lineWidth = thick * (0.5 - 0.01);
        ctx.globalAlpha = 0.7;
        ctx.stroke();

        ctx.strokeStyle = s.pal.pattern;
        ctx.lineWidth = thick * 0.2;
        ctx.setLineDash([4, 12]);
        ctx.globalAlpha = 0.2;
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Head
    var h = pts[0];
    var n = pts[Math.min(3, pts.length-1)];
    var ang = Math.atan2(h.y - n.y, h.x - n.x);

    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(ang);

    var hs = thick * 1.1;

    ctx.fillStyle = s.pal.body[1];
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.ellipse(hs * 0.3, 0, hs * 0.8, hs * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0a0808';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(hs * 0.7, -hs * 0.15, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hs * 0.7, hs * 0.15, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = s.pal.eye;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(hs * 0.7, -hs * 0.15, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hs * 0.7, hs * 0.15, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Tongue
    if (s.tongueOut > 0.7) {
      var tl = hs * 1.0 * (s.tongueOut - 0.7) * 3;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#cc2233';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(hs, 0);
      ctx.lineTo(hs + tl, -1.5);
      ctx.moveTo(hs, 0);
      ctx.lineTo(hs + tl, 1.5);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ─── 落花（大朵飘落） ───

  var fallingFlowers = [];

  function makeFallingFlower() {
    return {
      x: Math.random() * (W + 100) - 50,
      y: -30 - Math.random() * 80,
      vx: (Math.random() - 0.5) * 0.8,
      vy: 0.4 + Math.random() * 0.7,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.03,
      size: 18 + Math.random() * 28,
      phase: Math.random() * 100,
      swayAmp: 0.3 + Math.random() * 0.6,
      swayFreq: 0.3 + Math.random() * 0.5,
      alpha: 0.2 + Math.random() * 0.35,
    };
  }

  function initFallingFlowers() {
    fallingFlowers = [];
    for (var i = 0; i < 50; i++) {
      var f = makeFallingFlower();
      f.y = Math.random() * H;
      fallingFlowers.push(f);
    }
  }

  function updateFallingFlowers() {
    var t = Date.now() * 0.001;
    fallingFlowers.forEach(function(f) {
      f.x += f.vx + Math.sin(t * f.swayFreq + f.phase) * f.swayAmp;
      f.y += f.vy;
      f.rot += f.rv;
      if (f.y > H + 50) {
        f.y = -50;
        f.x = Math.random() * (W + 100) - 50;
      }
      if (f.x < -60) f.x = W + 40;
      if (f.x > W + 60) f.x = -40;
    });
  }

  function drawFallingFlower(f) {
    var t = Date.now() * 0.001;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);

    var sz = f.size;
    ctx.globalAlpha = f.alpha;

    for (var i = 0; i < 4; i++) {
      var a = (i / 4) * Math.PI * 2 + Math.sin(t * 0.5 + f.phase + i) * 0.05;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(sz * 0.9, -sz * 0.18, sz * 1.1, sz * 0.05);
      ctx.quadraticCurveTo(sz * 0.9, sz * 0.22, 0, 0);
      ctx.fillStyle = '#cc1a2b';
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,60,70,0.25)';
      ctx.lineWidth = 0.3;
      ctx.stroke();
      ctx.restore();
    }

    for (var i = 0; i < 4; i++) {
      var a = (i / 4) * Math.PI * 2 + Math.sin(t * 0.3 + f.phase * 0.7 + i * 0.5) * 0.08;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -sz * 1.6);
      ctx.strokeStyle = 'rgba(180,20,30,0.25)';
      ctx.lineWidth = 0.4;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -sz * 1.6, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = '#220808';
      ctx.fill();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, sz * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = '#220808';
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ─── 地面薄雾 ───

  function drawGroundMist() {
    var grad = ctx.createLinearGradient(0, H - 60, 0, H);
    grad.addColorStop(0, 'rgba(10,8,8,0)');
    grad.addColorStop(0.3, 'rgba(30,12,12,0.05)');
    grad.addColorStop(1, 'rgba(60,16,16,0.08)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H - 60, W, 60);
  }

  // ─── 红晕光效 ───

  function drawBloomGlow() {
    stalks.forEach(function(s) {
      var t = Date.now() * 0.001;
      var tx = s.x + s.curve + Math.sin(t * 0.4 + s.phase) * 3 + Math.sin(t * 0.25 + s.phase * 1.7) * 2;
      var ty = s.y - s.h;

      var grad = ctx.createRadialGradient(tx, ty, 0, tx, ty, 100);
      grad.addColorStop(0, 'rgba(180,20,30,0.03)');
      grad.addColorStop(1, 'rgba(180,20,30,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(tx - 120, ty - 120, 240, 240);
    });
  }

  // ─── 初始化 ───

  function init() {
    initLilies();
    initSnakes();
    initFallingFlowers();
  }

  // ─── 主循环 ───

  function loop() {
    var time = Date.now();
    ctx.clearRect(0, 0, W, H);

    // BG subtle gradient
    var bg = ctx.createRadialGradient(W*0.5, H*0.4, 0, W*0.5, H*0.4, Math.max(W,H)*0.6);
    bg.addColorStop(0, '#120a0a');
    bg.addColorStop(1, '#080606');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawBloomGlow();

    // Stalks behind snakes
    stalks.forEach(function(s) { drawLilyStalk(s, time); });

    snakes.forEach(function(s) { updateSnake(s, time); });
    snakes.forEach(function(s) { drawSnake(s, time); });

    // A few lilies in front
    stalks.slice(0, 3).forEach(function(s) {
      drawLilyStalk(s, time + 1000);
    });

    updateFallingFlowers();
    fallingFlowers.forEach(function(f) { drawFallingFlower(f); });

    drawGroundMist();

    requestAnimationFrame(loop);
  }

  init();
  loop();

  window.addEventListener('resize', function() {
    setTimeout(function() {
      resize();
      init();
    }, 200);
  });
})();
</script>

</body>
</html>
